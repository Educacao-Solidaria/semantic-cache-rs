# Política do cargo-deny para os workspaces de `crates/` (cada um com o seu
# Cargo.lock), aplicada pelo `.github/workflows/audit.yml`. Localmente:
#   cargo deny --manifest-path crates/<crate>/Cargo.toml --config deny.toml \
#     --locked check advisories licenses sources
#
# Exceção só neste arquivo, uma por achado, com o motivo e "revisar em
# AAAA-MM-DD": passada a data, a auditoria reprova até alguém rever. O
# cargo-audit do workflow recebe os `id` de `advisories.ignore` daqui. Nenhuma
# regra é desligada inteira (o tests/audit.rs do servidor confere).

[graph]
# Dependência opcional também entra no grafo, como entra no Cargo.lock.
all-features = true

[advisories]
# Banco do RustSec, baixado a cada execução. Vulnerabilidade sempre reprova;
# crate sem manutenção, "unsound" e versão retirada (yanked) também, em
# qualquer ponto do grafo.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Um arquivo para cinco workspaces: a exceção de um não aparece nos outros.
unused-ignored-advisory = "allow"
ignore = [
  # sled 0.34.7 (persistência, PR 35/100): a última estável, de 2021; o 1.0
  # segue em alpha. Nenhum aviso de vulnerabilidade nele nem nestes dois.
  { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 sem manutenção, só pelo sled 0.34.7 (hash não criptográfico das estruturas internas); sai com a troca do sled; revisar em 2027-01-22" },
  { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 sem manutenção, só pelo parking_lot 0.11 do sled 0.34.7 (fora do wasm é o Instant da std); sai com a troca do sled; revisar em 2027-01-22" },
  # O jemalloc do servidor.
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 sem manutenção, macro de compilação do tikv-jemalloc-ctl 0.7.0 (a mais nova); não entra no binário; revisar em 2027-01-22" },
  # O codec do crate de domínio da raiz (do Luan).
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 sem manutenção, dependência do crate da raiz (avisado ao Luan no PR 97/100); revisar em 2027-01-22" },
]

[licenses]
# As de desenvolvimento também (criterion, dhat, tower...): todas as
# dependências, não só as do binário.
include-dev = true
# Só licenças permissivas. Outra entra como exceção do crate que a usa.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
# Um arquivo para cinco workspaces: o que um usa falta nos outros.
unused-allowed-license = "allow"
unused-license-exception = "allow"
# Os crates deste repositório com `publish = false` não são de terceiros.
private = { ignore = true }

# O crate de domínio da raiz (`semantic-cache-rs`, do Luan) não declara
# `license` nem `publish = false`, e o repositório não tem LICENSE: o
# cargo-deny o lê como "sem licença". É código deste repositório, não de
# terceiro, e a referência abaixo só o identifica. Sai quando o Cargo.toml da
# raiz ganhar um dos dois (avisado ao Luan no PR 97/100); revisar em 2027-01-22.
[[licenses.clarify]]
crate = "semantic-cache-rs"
expression = "LicenseRef-semantic-cache-rs"
license-files = []

# A referência acima vale só para esse crate; revisar em 2027-01-22.
[[licenses.exceptions]]
crate = "semantic-cache-rs"
allow = ["LicenseRef-semantic-cache-rs"]

[sources]
# Só o crates.io, o registro que o RustSec cobre: git ou outro registro reprova.
unknown-registry = "deny"
unknown-git = "deny"
