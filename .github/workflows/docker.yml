name: Docker

# A imagem do servidor (Dockerfile na raiz): build com o cache do Buildx no
# cache do Actions, conteúdo conferido entrada por entrada, o smoke do container
# (socket, PING, /health, SIGTERM e queda) e o compose (deploy/compose/) com o
# socket falado de outro container. Nada é publicado: a imagem só existe no
# runner.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: imagem (scratch, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bash com pipefail (sem `shell:`, o Actions roda `bash -e` sem ele).
    defaults:
      run:
        shell: bash
    env:
      IMAGE: educacao-solidaria/semantic-cache:dev
      # hadolint da release oficial, fixado; o sha256 é o do checksums.sha256 dela.
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      # O cliente UDS do gateway (flow-gateway-go, público) no mesmo sha do job
      # e2e do ci.yml.
      GATEWAY_SHA: 9e51bc213b077002240744a9ca52f81477bc7d22
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "$base/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
      - uses: docker/setup-buildx-action@v4
      # Cache inteiro (mode=max): a camada que importa, a das dependências
      # compiladas pelo cargo-chef, é de um estágio intermediário.
      - name: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=semantic-cache
          cache-to: type=gha,scope=semantic-cache,mode=max
      - name: tamanho, usuário e conteúdo
        run: |
          # Com o image store do containerd, o `.Size` é o comprimido; a soma
          # da camada (abaixo) é o descomprimido. Os dois ficam sob 15 MB.
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE")
          echo "docker image inspect: $size bytes"
          test "$size" -lt 15000000
          test "$(docker image inspect -f '{{.Config.User}}' "$IMAGE")" = 65532:65532
          docker run --rm "$IMAGE" --version | tee "$RUNNER_TEMP/version.txt"
          grep -qF '(release, x86_64-linux)' "$RUNNER_TEMP/version.txt"
          # Uma camada só, conferida entrada por entrada (modo, dono, caminho):
          # sem shell e sem nada além do binário e das pastas do serviço.
          mkdir "$RUNNER_TEMP/image"
          docker save "$IMAGE" | tar -x -C "$RUNNER_TEMP/image"
          mapfile -t layers < <(jq -r '.[0].Layers[]' "$RUNNER_TEMP/image/manifest.json")
          test "${#layers[@]}" -eq 1
          tar -tvf "$RUNNER_TEMP/image/${layers[0]}" --numeric-owner > "$RUNNER_TEMP/tar.txt"
          unpacked=$(awk '{s += $3} END {print s}' "$RUNNER_TEMP/tar.txt")
          echo "camada descomprimida: $unpacked bytes"
          test "$unpacked" -lt 15000000
          awk '$NF != "./" {print $1, $2, $NF}' "$RUNNER_TEMP/tar.txt" | LC_ALL=C sort > "$RUNNER_TEMP/layer.txt"
          diff -u - "$RUNNER_TEMP/layer.txt" <<'EOF'
          -rwxr-xr-x 0/0 usr/local/bin/semantic-cache-server
          drwx------ 65532/65532 run/semantic-cache/
          drwx------ 65532/65532 var/lib/semantic-cache/
          drwxr-xr-x 0/0 run/
          drwxr-xr-x 0/0 usr/
          drwxr-xr-x 0/0 usr/local/
          drwxr-xr-x 0/0 usr/local/bin/
          drwxr-xr-x 0/0 var/
          drwxr-xr-x 0/0 var/lib/
          EOF
      # O smoke do container (crates/semantic-cache-server/tests/smoke.rs), um
      # teste `#[ignore]` compilado aqui e rodado como root: o volume e o socket
      # só abrem para o uid 65532 e para root.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/semantic-cache-server -> target
      - name: smoke do container
        working-directory: crates/semantic-cache-server
        run: |
          bin=$(cargo test --locked --test smoke --no-run --message-format=json \
            | jq -r 'select(.target.name == "smoke" and .executable != null) | .executable')
          test -x "$bin"
          sudo SEMCACHE_SMOKE_IMAGE="$IMAGE" "$bin" --ignored --nocapture | tee "$RUNNER_TEMP/smoke.txt"
          # O smoke rodou de fato: sem o `--ignored`, o passo só passaria pelos
          # testes sem Docker.
          grep -q '^test result: ok\. 1 passed;' "$RUNNER_TEMP/smoke.txt"
      # O cliente do gateway (internal/udscache), estático: `internal/` só se
      # importa de dentro do módulo, então o probe entra no checkout dele.
      - uses: actions/checkout@v4
        with:
          repository: Educacao-Solidaria/flow-gateway-go
          ref: ${{ env.GATEWAY_SHA }}
          path: gateway
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: gateway/go.sum
      - name: cliente Go do gateway
        working-directory: gateway
        run: |
          mkdir cmd/gateway-probe
          cp ../crates/semantic-cache-testkit/gateway-e2e/probe/main.go cmd/gateway-probe/
          test -z "$(gofmt -l cmd/gateway-probe | tee /dev/stderr)"
          go vet ./cmd/gateway-probe/
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/gateway-probe" ./cmd/gateway-probe
      - name: compose, socket entre containers
        run: |
          compose() { docker compose -f deploy/compose/compose.yaml "$@"; }
          compose up --detach --wait --wait-timeout 60 --pull never --no-build cache
          # Pelo volume, como o outro container o vê: a pasta da imagem e o socket.
          ipc=$(docker volume inspect -f '{{.Mountpoint}}' semantic-cache_cache-ipc)
          sudo stat -c '%a %u:%g %F' "$ipc" "$ipc/semantic-cache.sock" | tee "$RUNNER_TEMP/ipc.txt"
          diff -u - "$RUNNER_TEMP/ipc.txt" <<'EOF'
          700 65532:65532 directory
          600 65532:65532 socket
          EOF
          # PING de outro container, com o uid 65532 e sem rede: só o volume liga.
          compose run --rm -T ping
          # Outro uid, e root sem capabilities, não chegam ao socket.
          refused=true
          for user in 65533:65533 0:0; do
            echo "--user $user"
            if compose run --rm -T --user "$user" ping > "$RUNNER_TEMP/ping.txt" 2>&1; then
              echo "::error::o uid $user conversou com o cache"; refused=false
            elif ! grep -F 'Permission denied (os error 13)' "$RUNNER_TEMP/ping.txt"; then
              cat "$RUNNER_TEMP/ping.txt"; echo "::error::o uid $user falhou por outro motivo"; refused=false
            fi
          done
          test "$refused" = true
          # O cliente do gateway no lugar do PING: STATS com o dono do socket e
          # o processo do outro lado conferidos (Lstat e SO_PEERCRED); esperando
          # outro dono, ele mesmo recusa (saída 2, ErrUntrustedSocket).
          gateway() {
            compose run --rm -T --entrypoint /usr/local/bin/gateway-probe \
              -v "$RUNNER_TEMP/gateway-probe:/usr/local/bin/gateway-probe:ro" \
              -e FLOW_CACHE_SOCKET_PATH=/run/semantic-cache/semantic-cache.sock \
              -e "FLOW_CACHE_SOCKET_OWNER_UID=$1" ping
          }
          gateway 65532
          status=0
          gateway 65533 || status=$?
          test "$status" = 2
