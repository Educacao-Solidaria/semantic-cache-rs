name: Auditoria

# Vulnerabilidades conhecidas e licenças de todas as dependências Rust: o
# cargo-deny aplica o deny.toml (avisos do RustSec, licenças e origem) ao grafo
# de cada workspace, e o cargo-audit lê cada Cargo.lock direto (a segunda
# leitura do RustSec, de outra implementação). Aviso novo aparece sem ninguém
# mudar o código: roda também todo dia. Nada é publicado.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: auditoria (cargo-deny e cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # bash com pipefail (sem `shell:`, o Actions roda `bash -e` sem ele).
    defaults:
      run:
        shell: bash
    env:
      # Releases oficiais, fixadas. O sha256 do cargo-deny é o do `.sha256` da
      # release; o do cargo-audit, que não publica checksum, é o digest do
      # asset na API de releases do GitHub.
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      # Todo workspace com Cargo.lock (o tests/audit.rs do servidor confere).
      # O crate da raiz não tem lock próprio: entra pelos que dependem dele.
      WORKSPACES: >-
        crates/semantic-cache-server
        crates/semantic-cache-testkit
        crates/semantic-cache-simd
        crates/semantic-cache-tokenizer
        crates/semantic-cache-ipc
    # Os gatilhos e as linhas que reprovam estão fixados no tests/audit.rs do
    # servidor: mudou um deles (ou um `if:`), reveja o teste junto.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # O cargo-deny monta o grafo pelo `cargo metadata` (nada é compilado).
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny e cargo-audit
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$bin" --strip-components=1 "${deny}/cargo-deny"
          audit="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/${audit}.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/audit.tgz" -C "$bin" --strip-components=1 "${audit}/cargo-audit"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cargo-deny" --version
          "$bin/cargo-audit" --version
      # Exceção vencida deixa de valer: reprova até alguém rever o achado e
      # mudar a data, ou tirar a exceção. Vale até o dia da data, inclusive.
      # Só awk (sem grep): deny.toml sem exceção nenhuma não é falha.
      - name: exceções no prazo
        run: |
          today=$(date -u +%F)
          expired=$(awk -v today="$today" '
            match($0, /revisar em [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/) &&
              substr($0, RSTART + 11, 10) < today { print FNR ": " $0 }' deny.toml)
          if [ -n "$expired" ]; then
            echo "::error file=deny.toml::exceção vencida (hoje: $today)"
            echo "$expired"
            exit 1
          fi
      # Um passo reprovado não esconde o outro.
      - name: cargo deny
        if: ${{ !cancelled() }}
        run: |
          status=0
          for w in $WORKSPACES; do
            echo "== $w"
            cargo-deny --manifest-path "$w/Cargo.toml" --config deny.toml --locked \
              check advisories licenses sources || status=1
          done
          exit "$status"
      - name: cargo audit
        if: ${{ !cancelled() }}
        run: |
          # As exceções são as do deny.toml: uma lista só, com motivo e data.
          mapfile -t ignore < <(python3 -c 'import tomllib
          for e in tomllib.load(open("deny.toml", "rb"))["advisories"]["ignore"]:
              print("--ignore=" + e["id"])')
          status=0
          for w in $WORKSPACES; do
            echo "== $w"
            cargo-audit audit --file "$w/Cargo.lock" "${ignore[@]}" || status=1
          done
          exit "$status"
