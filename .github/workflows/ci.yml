name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Crates checados pelo CI. Manifest ausente é pulado, então o crate de
  # domínio da raiz entra sozinho quando o Cargo.toml dele chegar à main.
  MANIFESTS: >-
    Cargo.toml
    crates/semantic-cache-server/Cargo.toml
    crates/semantic-cache-testkit/Cargo.toml
    crates/semantic-cache-simd/Cargo.toml
    crates/semantic-cache-tokenizer/Cargo.toml
    crates/semantic-cache-ipc/Cargo.toml

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Sem `--all`: ele formataria também as dependências por path (o testkit
      # aponta para o crate da raiz), e cada crate seria checado duas vezes.
      - name: cargo fmt --check
        run: |
          for m in $MANIFESTS; do
            [ -f "$m" ] || continue
            cargo fmt --manifest-path "$m" -- --check
          done

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/semantic-cache-server -> target
            crates/semantic-cache-testkit -> target
            crates/semantic-cache-simd -> target
            crates/semantic-cache-tokenizer -> target
            crates/semantic-cache-ipc -> target
      - name: cargo clippy -D warnings
        run: |
          for m in $MANIFESTS; do
            [ -f "$m" ] || continue
            lock=""; [ -f "$(dirname "$m")/Cargo.lock" ] && lock="--locked"
            cargo clippy --manifest-path "$m" --all-targets $lock -- -D warnings
          done

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/semantic-cache-server -> target
            crates/semantic-cache-testkit -> target
            crates/semantic-cache-simd -> target
            crates/semantic-cache-tokenizer -> target
            crates/semantic-cache-ipc -> target
      - name: cargo test
        run: |
          for m in $MANIFESTS; do
            [ -f "$m" ] || continue
            lock=""; [ -f "$(dirname "$m")/Cargo.lock" ] && lock="--locked"
            cargo test --manifest-path "$m" --all-targets $lock
          done

  bench:
    name: benches compilam
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/semantic-cache-testkit
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/semantic-cache-testkit -> target
      # Compila no profile `bench` (otimizado), sem medir: o relógio de um runner
      # compartilhado não dá número confiável. A regressão de cada PR é medida em
      # contagem de instruções, no bench-regression.yml.
      - name: cargo bench --no-run
        run: cargo bench --no-run --locked

  simd:
    name: simd (aarch64 + avx512)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/semantic-cache-simd
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      # O runner é x86-64: aqui o ramo NEON só compila (clippy cruzado); quem o
      # executa é o job `simd-arm64`.
      - name: clippy aarch64
        run: cargo clippy --all-targets --locked --target aarch64-unknown-linux-gnu -- -D warnings
      - name: cargo test --features avx512
        run: cargo test --all-targets --locked --features avx512

  simd-arm64:
    name: simd (arm64 nativo)
    # Runner ARM do GitHub (grátis em repositório público): os kernels NEON
    # rodam contra a referência escalar numa CPU ARM de verdade.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: crates/semantic-cache-simd
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/semantic-cache-simd -> target
      - name: cargo test (NEON)
        run: cargo test --all-targets --locked

  windows:
    name: ipc (windows, named pipe)
    # Runner Windows do GitHub (grátis em repositório público): o named pipe
    # roda de verdade, em vez de só o clippy cruzado. Um comando por passo: no
    # pwsh do Actions, só o código de saída do último comando conta.
    runs-on: windows-latest
    # Os testes têm prazo de 10 s; isto só corta um travamento do runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/semantic-cache-ipc -> target
            crates/semantic-cache-server -> target
      - name: clippy (ipc)
        working-directory: crates/semantic-cache-ipc
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test (ipc)
        working-directory: crates/semantic-cache-ipc
        run: cargo test --all-targets --locked
      - name: binário no named pipe
        working-directory: crates/semantic-cache-server
        run: cargo test --locked --test binary_test

  release:
    name: build release (LTO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/semantic-cache-server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/semantic-cache-server -> target
      - name: cargo build --release
        run: cargo build --release --locked
      - name: binário sai do profile release
        run: ./target/release/semantic-cache-server --version | grep -F '(release,'

  e2e:
    name: e2e (rust ⇄ go)
    # O cliente do gateway (flow-gateway-go, público) contra os binários daqui.
    # O teste Go (crates/semantic-cache-testkit/gateway-e2e/) entra no checkout:
    # `internal/` só se importa de dentro do módulo.
    runs-on: ubuntu-latest
    # Cada espera do teste tem prazo de 10 s; isto só corta um travamento do runner.
    timeout-minutes: 20
    # Roda código de outro repositório: token só de leitura.
    permissions:
      contents: read
    env:
      # main do flow-gateway-go com o cliente UDS; fixada para o job só mudar
      # quando este sha mudar.
      GATEWAY_SHA: 9e51bc213b077002240744a9ca52f81477bc7d22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Educacao-Solidaria/flow-gateway-go
          ref: ${{ env.GATEWAY_SHA }}
          path: gateway
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: gateway/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/semantic-cache-server -> target
            crates/semantic-cache-testkit -> target
      - name: binários Rust
        run: |
          cargo build --locked --manifest-path crates/semantic-cache-server/Cargo.toml
          cargo build --locked --manifest-path crates/semantic-cache-testkit/Cargo.toml --bin reference-server
      - name: cliente Go contra os binários
        working-directory: gateway
        env:
          SEMCACHE_E2E_SERVER: ${{ github.workspace }}/crates/semantic-cache-server/target/debug/semantic-cache-server
          SEMCACHE_E2E_REFERENCE: ${{ github.workspace }}/crates/semantic-cache-testkit/target/debug/reference-server
        run: |
          mkdir internal/e2erust
          cp ../crates/semantic-cache-testkit/gateway-e2e/e2e_test.go internal/e2erust/
          test -z "$(gofmt -l internal/e2erust | tee /dev/stderr)"
          go vet ./internal/e2erust/
          go test -race -count=1 -v ./internal/e2erust/

  alerts:
    name: alertas (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Baixa um binário de fora: token só de leitura.
    permissions:
      contents: read
    env:
      # promtool da release oficial, fixado; o sha256 é o do sha256sums.txt dela.
      PROMETHEUS_VERSION: 3.5.0
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@v7
      - name: promtool
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl -fsSL -o prometheus.tar.gz "$base/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar -xzf prometheus.tar.gz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: promtool check rules
        run: ./promtool check rules deploy/prometheus/semantic-cache-alerts.yml
      # Cada regra dispara com a série que deve e cala com as que não devem.
      - name: promtool test rules
        run: ./promtool test rules deploy/prometheus/semantic-cache-alerts.test.yml
