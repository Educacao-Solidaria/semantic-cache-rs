# Raiz de workspace própria: isola o servidor do Cargo.toml da raiz do
# repositório (crate de domínio `semantic-cache-rs`) até a unificação dos
# manifests. Quando isso acontecer, as seções `[workspace.*]` e `[profile.*]`
# sobem para o manifest da raiz e este arquivo fica só com o `[package]`.
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Luan <in100tiva>", "Victor <VictorNascimento14>"]
repository = "https://github.com/Educacao-Solidaria/semantic-cache-rs"
publish = false

# Versões únicas para todos os crates do workspace; cada crate declara
# `dep = { workspace = true }` e herda daqui.
[workspace.dependencies]
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Binário de latência crítica (<2ms): troca tempo de compilação por código
# mais rápido e menor.
[profile.release]
opt-level = 3
lto = true            # LTO "fat": otimiza através das fronteiras de crate
codegen-units = 1     # uma unidade de codegen: mais inlining, build mais lento
strip = "symbols"     # binário sem tabela de símbolos nem debuginfo
debug = false
incremental = false

# Release com símbolos, para perf/flamegraph nos benchmarks da Fase 4:
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[package]
name = "semantic-cache-server"
description = "Binário do servidor MCP do semantic-cache-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

# jemalloc não compila com o toolchain MSVC; lá o servidor fica no alocador
# do sistema e `alloc::stats()` devolve `None`.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[lints]
workspace = true
