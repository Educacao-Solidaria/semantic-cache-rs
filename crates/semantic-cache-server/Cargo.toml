# Raiz de workspace própria: isola o servidor do Cargo.toml da raiz do
# repositório (crate de domínio `semantic-cache-rs`) até a unificação dos
# manifests. Quando isso acontecer, as seções `[workspace.*]` e `[profile.*]`
# sobem para o manifest da raiz e este arquivo fica só com o `[package]`.
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.81: MSRV do rkyv 0.8 (`archive`, PR 59/100).
rust-version = "1.81"
authors = ["Luan <in100tiva>", "Victor <VictorNascimento14>"]
repository = "https://github.com/Educacao-Solidaria/semantic-cache-rs"
publish = false

# Versões únicas para todos os crates do workspace; cada crate declara
# `dep = { workspace = true }` e herda daqui.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
# Crate de domínio da raiz: `CacheEntry`, `CacheStore` e o codec bincode.
semantic-cache-rs = { path = "../.." }
# Troca atômica de `Arc`: leitura sem trava do estado compartilhado.
arc-swap = "1"
# Banco embutido da persistência. A 0.34.7, de 2021, é a última estável (o
# 1.0 segue em alpha); risco registrado no PR 35/100.
sled = "0.34"
# API HTTP de depuração (PR 53/100); só o necessário: HTTP/1, JSON e query.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
# Formato zero-copy das entradas (`archive`); com o `bytecheck` (padrão), todo
# acesso a bytes do disco é validado.
rkyv = "0.8"
# Compressão opcional das entradas no disco (`archive`): LZ4 puro Rust, sem
# `unsafe` (`safe-*`) e só o formato em bloco (sem o `frame`). A 0.14 já tem a
# correção do RUSTSEC-2026-0041 (offset de cópia sem validar na descompressão).
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
# Codec e servidor do IPC v1 (socket Unix; no Windows, named pipe).
semantic-cache-ipc = { path = "../semantic-cache-ipc" }
# A busca vetorial do soak (`tests/soak.rs`), com os kernels de produção.
semantic-cache-simd = { path = "../semantic-cache-simd" }
# `ServiceExt::oneshot` nos testes da API (já vem com o axum).
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Binário de latência crítica (<2ms): troca tempo de compilação por código
# mais rápido e menor.
[profile.release]
opt-level = 3
lto = true            # LTO "fat": otimiza através das fronteiras de crate
codegen-units = 1     # uma unidade de codegen: mais inlining, build mais lento
strip = "symbols"     # binário sem tabela de símbolos nem debuginfo
debug = false
incremental = false

# Release com símbolos, para perf/flamegraph nos benchmarks da Fase 4:
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[package]
name = "semantic-cache-server"
description = "Binário do servidor MCP do semantic-cache-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true }
lz4_flex = { workspace = true }
rkyv = { workspace = true }
semantic-cache-ipc = { workspace = true }
semantic-cache-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sled = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
semantic-cache-simd = { workspace = true }
tower = { workspace = true }

# jemalloc não compila com o toolchain MSVC; lá o servidor fica no alocador
# do sistema e `alloc::stats()` devolve `None`.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[lints]
workspace = true
