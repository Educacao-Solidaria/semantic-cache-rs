# Tokenizador BPE compatível com o cl100k_base (contar tokens sem API externa).
# Raiz de workspace própria, como os outros crates de `crates/`.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "semantic-cache-tokenizer"
description = "Tokenizador BPE compatível com o cl100k_base do semantic-cache-rs"
version = "0.1.0"
edition = "2021"
# 1.80: `LazyLock`.
rust-version = "1.80"
authors = ["Luan <in100tiva>", "Victor <VictorNascimento14>"]
repository = "https://github.com/Educacao-Solidaria/semantic-cache-rs"
publish = false

[dependencies]
# Tabelas Unicode de `\p{L}`/`\p{N}` para a pré-tokenização (as do `regex`).
regex-syntax = "0.8"

[dev-dependencies]
# Oráculo: a pré-tokenização por regex do PR 25, comparada com a varredura.
regex = "1"

[lints.rust]
# `deny`, não `forbid`: o teste de alocação precisa de um alocador global.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
