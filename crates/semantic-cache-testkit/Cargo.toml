# Ferramental de teste e medição: harness de benchmarks, fixtures e asserções
# compartilhadas. Nunca entra no binário do servidor (`publish = false`, sem
# dependentes fora de `[dev-dependencies]`).
#
# Raiz de workspace própria, como o servidor: isola do manifest da raiz até a
# unificação dos workspaces.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "semantic-cache-testkit"
description = "Harness de benchmarks e utilitários de teste do semantic-cache-rs"
version = "0.1.0"
edition = "2021"
# 1.86: MSRV do criterion 0.8 (o servidor segue em 1.80).
rust-version = "1.86"
authors = ["Luan <in100tiva>", "Victor <VictorNascimento14>"]
repository = "https://github.com/Educacao-Solidaria/semantic-cache-rs"
publish = false

[dependencies]
# Sem `plotters`/HTML: o relatório estatístico (média, IC 95%, outliers e
# detecção de regressão) sai no terminal e em `target/criterion/**/*.json`.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Crate de domínio da raiz: as fixtures devolvem os tipos dele (`Vector`,
# `VectorBatch`) e os benchmarks medem as métricas dele.
semantic-cache-rs = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# Kernels SIMD: medidos lado a lado com a referência no bench de
# similaridade, e o motor das varreduras lineares do harness de estresse.
semantic-cache-simd = { path = "../semantic-cache-simd" }
# Codec e `serve` de produção do IPC v1: o servidor de referência (`ipc`) e o
# bench de ponta a ponta medem o mesmo caminho que o gateway usa.
semantic-cache-ipc = { path = "../semantic-cache-ipc" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# O alocador do servidor no bench `ipc`: com o do sistema, o `FlatI8` (uma alocação
# por vetor) espalha os códigos pelo heap da linha anterior e busca até 3× mais devagar.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = "0.7"

[[bench]]
name = "similarity"
harness = false

[[bench]]
name = "stress"
harness = false

[[bench]]
name = "ipc"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
